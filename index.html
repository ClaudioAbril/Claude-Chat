<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claude – PoC - v.1.05</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <style>
    /* ── Variables ── */
    :root {
      --bg: #0d0f12;
      --surface: #161a1f;
      --border: #2a2f38;
      --accent: #e8a87c;
      --accent2: #7cb8e8;
      --text: #d4d8de;
      --muted: #5a6370;
      --user-bg: #1e2530;
      --claude-bg: #12161b;
      --radius: 10px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Token stats ── */
    .header-stats {
      display: flex;
      align-items: center;
      gap: 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .stat-sep {
      margin: 0 10px;
      color: var(--border);
    }

    .stat-label {
      color: var(--muted);
    }

    .stat-value {
      color: var(--accent2);
      font-weight: 600;
      transition: color .3s;
    }

    .stat-value.flash {
      color: var(--accent);
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4caf6e;
      animation: pulse 2s infinite;
    }

    .dot.error {
      background: #e87c7c;
      animation: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 4px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .msg {
      display: flex;
      gap: 14px;
      padding: 10px 20px;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      background: var(--user-bg);
    }

    .msg.claude {
      background: transparent;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .avatar {
      background: var(--accent);
      color: #1a1200;
    }

    .msg.claude .avatar {
      background: var(--accent2);
      color: #001220;
    }

    .bubble {
      flex: 1;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .30s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(.8);
        opacity: .5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    /* ── Empty state ── */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
      user-select: none;
    }

    #empty .big {
      font-size: 40px;
    }

    /* ── Input bar ── */
    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      resize: none;
      min-height: 42px;
      max-height: 160px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s;
    }

    #input:focus {
      border-color: var(--accent2);
    }

    #input::placeholder {
      color: var(--muted);
    }

    #send {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
      color: #1a1200;
    }

    #send:hover:not(:disabled) {
      opacity: .85;
    }

    #send:active:not(:disabled) {
      transform: scale(.95);
    }

    #send:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    #send svg {
      width: 18px;
      height: 18px;
    }

    /* ── Error banner ── */
    #error-bar {
      display: none;
      background: #2a1515;
      border-top: 1px solid #5a2020;
      padding: 8px 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: #e87c7c;
      flex-shrink: 0;
    }

    /* ── Settings panel ── */
    #settings-btn {
      margin-left: 8px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      transition: border-color .15s, color .15s;
    }
    #settings-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    #settings-btn.active { border-color: var(--accent); color: var(--accent); }

    #settings-panel {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      flex-shrink: 0;
      animation: fadeIn .15s ease;
    }
    #settings-panel.open { display: block; }

    .settings-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #api-key-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      letter-spacing: .04em;
    }
    #api-key-input:focus { border-color: var(--accent2); }
    #api-key-input::placeholder { color: var(--muted); }

    #save-key-btn {
      background: var(--accent);
      color: #1a1200;
      border: none;
      border-radius: var(--radius);
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: opacity .15s;
      white-space: nowrap;
    }
    #save-key-btn:hover { opacity: .85; }

    #clear-key-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    #clear-key-btn:hover { border-color: #e87c7c; color: #e87c7c; }

    .key-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .key-status.ok { color: #4caf6e; }
    .key-status.missing { color: #e8a87c; }
  </style>
</head>

<body>

  <header>
    <div class="logo">✦</div>
    <h1>Claude · PoC</h1>

    <span class="stat-sep">·</span>

    <div class="header-stats">
      <span class="stat-label">Tokens sesión&nbsp;</span>
      <span class="stat-value" id="stat-tokens">0</span>
      <span class="stat-sep">·</span>
      <span class="stat-label">↑&nbsp;</span>
      <span class="stat-value" id="stat-in">0</span>
      <span class="stat-sep">&nbsp;↓&nbsp;</span>
      <span class="stat-value" id="stat-out">0</span>
    </div>

    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">listo</span>
    </div>
    <button id="settings-btn" title="Configurar API Key">⚙</button>
  </header>

  <!-- Settings panel (below header) -->
  <div id="settings-panel">
    <div class="settings-inner">
      <span class="settings-label">API Key de Anthropic</span>
      <div class="settings-row">
        <input id="api-key-input" type="password" placeholder="sk-ant-api03-…" autocomplete="off" spellcheck="false" />
        <button id="save-key-btn">Guardar</button>
        <button id="clear-key-btn" title="Borrar key">✕</button>
      </div>
      <span class="key-status" id="key-status">Sin key configurada</span>
    </div>
  </div>

  <div id="messages">
    <div id="empty">
      <div class="big">✦</div>
      <div>Enviá tu primer mensaje</div>
    </div>
  </div>

  <div id="error-bar" role="alert"></div>

  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Escribí tu mensaje… (Enter para enviar, Shift+Enter para nueva línea)"
        autocomplete="off"></textarea>
      <button id="send" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // ══════════════════════════════════════════
    //  CONFIGURACIÓN  ← única línea a cambiar
    // ══════════════════════════════════════════
    // ── Apuntá esto a tu Cloudflare Worker después de deployarlo ──
    const WORKER_URL = "https://muddy-wildflower-c8f9.claudioabril1000.workers.dev/v1/messages";
    const MODEL = "claude-sonnet-4-20250514";
    const SYSTEM = "Eres un asistente útil y conciso. Respondés en el mismo idioma del usuario.";
    // ══════════════════════════════════════════

    const messagesEl = document.getElementById("messages");
    const emptyEl = document.getElementById("empty");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const dotEl = document.getElementById("dot");
    const statusEl = document.getElementById("status-text");
    const errorBar = document.getElementById("error-bar");

    // ── Settings / API Key ──
    const settingsBtn   = document.getElementById("settings-btn");
    const settingsPanel = document.getElementById("settings-panel");
    const apiKeyInput   = document.getElementById("api-key-input");
    const saveKeyBtn    = document.getElementById("save-key-btn");
    const clearKeyBtn   = document.getElementById("clear-key-btn");
    const keyStatus     = document.getElementById("key-status");

    const LS_KEY = "poc_anthropic_key";

    function loadKey() {
      return localStorage.getItem(LS_KEY) || "";
    }

    function saveKey(k) {
      if (k) localStorage.setItem(LS_KEY, k);
      else    localStorage.removeItem(LS_KEY);
    }

    function refreshKeyStatus() {
      const k = loadKey();
      if (k) {
        keyStatus.textContent = "✓ Key configurada (" + k.slice(0, 14) + "…)";
        keyStatus.className = "key-status ok";
        settingsBtn.classList.add("active");
      } else {
        keyStatus.textContent = "Sin key configurada";
        keyStatus.className = "key-status missing";
        settingsBtn.classList.remove("active");
      }
    }

    // Init
    apiKeyInput.value = loadKey();
    refreshKeyStatus();

    settingsBtn.addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
    });

    saveKeyBtn.addEventListener("click", () => {
      const val = apiKeyInput.value.trim();
      saveKey(val);
      refreshKeyStatus();
      settingsPanel.classList.remove("open");
    });

    clearKeyBtn.addEventListener("click", () => {
      apiKeyInput.value = "";
      saveKey("");
      refreshKeyStatus();
    });

    const history = [];   // {role, content}[]
    let busy = false;

    // ── Token counters ──
    let totalIn = 0;
    let totalOut = 0;

    const statTokens = document.getElementById("stat-tokens");
    const statIn = document.getElementById("stat-in");
    const statOut = document.getElementById("stat-out");

    function fmt(n) {
      return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n);
    }

    function updateTokens(usage) {
      totalIn += usage.input_tokens ?? 0;
      totalOut += usage.output_tokens ?? 0;
      statIn.textContent = fmt(totalIn);
      statOut.textContent = fmt(totalOut);
      statTokens.textContent = fmt(totalIn + totalOut);
      [statTokens, statIn, statOut].forEach(el => {
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 600);
      });
    }

    // ── Auto-resize textarea ──
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    // ── Enter to send ──
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    sendBtn.addEventListener("click", send);

    // ── Render a message bubble ──
    function addBubble(role, text) {
      emptyEl.style.display = "none";

      const msg = document.createElement("div");
      msg.className = `msg ${role}`;

      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = role === "user" ? "TÚ" : "AI";

      const bub = document.createElement("div");
      bub.className = "bubble";
      bub.textContent = text;

      msg.appendChild(av);
      msg.appendChild(bub);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bub;   // returned so we can stream into it
    }

    // ── Typing indicator ──
    function addTyping() {
      const msg = document.createElement("div");
      msg.className = "msg claude";
      msg.id = "typing-msg";

      const av = document.createElement("div");
      av.className = "avatar";
      av.textContent = "AI";

      const t = document.createElement("div");
      t.className = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";

      msg.appendChild(av);
      msg.appendChild(t);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typing-msg")?.remove();
    }

    // ── Set UI state ──
    function setLoading(on) {
      busy = on;
      sendBtn.disabled = on;
      inputEl.disabled = on;
      dotEl.className = on ? "dot error" : "dot";
      statusEl.textContent = on ? "procesando…" : "listo";
      if (on) errorBar.style.display = "none";
    }

    function showError(msg) {
      errorBar.textContent = "⚠ " + msg;
      errorBar.style.display = "block";
      dotEl.className = "dot error";
      statusEl.textContent = "error";
    }

    // ── Main send function ──
    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      inputEl.value = "";
      inputEl.style.height = "auto";

      addBubble("user", text);
      history.push({ role: "user", content: text });

      setLoading(true);
      addTyping();

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "anthropic-version": "2023-06-01",
            ...(loadKey() ? { "x-user-api-key": loadKey() } : {}),
          },
          body: JSON.stringify({
            model: MODEL,
            max_tokens: 1024,
            system: SYSTEM,
            messages: history,
          }),
        });

        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err?.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        const reply = data.content?.[0]?.text ?? "(sin respuesta)";

        if (data.usage) updateTokens(data.usage);

        removeTyping();
        addBubble("claude", reply);
        history.push({ role: "assistant", content: reply });

      } catch (err) {
        removeTyping();
        showError(err.message);
      } finally {
        setLoading(false);
        inputEl.focus();
      }
    }

    inputEl.focus();
  </script>
</body>

</html>
