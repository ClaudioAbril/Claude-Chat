<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:,">
  <title>AI Chat – PoC – 20260530.1</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    /* ── Variables ── */
    :root {
      --bg: #0d0f12;
      --surface: #161a1f;
      --border: #2a2f38;
      --accent: #e8a87c;
      --accent2: #7cb8e8;
      --text: #d4d8de;
      --muted: #5a6370;
      --user-bg: #1e2530;
      --claude-bg: #12161b;
      --radius: 10px;
      --mono: 'IBM Plex Mono', monospace;
      --sans: 'IBM Plex Sans', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .logo {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    header h1 {
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Token stats ── */
    .header-stats {
      display: flex;
      align-items: center;
      gap: 0;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .stat-sep {
      margin: 0 10px;
      color: var(--border);
    }

    .stat-label {
      color: var(--muted);
    }

    .stat-value {
      color: var(--accent2);
      font-weight: 600;
      transition: color .3s;
    }

    .stat-value.flash {
      color: var(--accent);
    }

    .status {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted);
      font-family: var(--mono);
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #4caf6e;
      animation: pulse 2s infinite;
    }

    .dot.error {
      background: #e87c7c;
      animation: none;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .4;
      }
    }

    /* ── Messages area ── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 0;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar {
      width: 4px;
    }

    #messages::-webkit-scrollbar-track {
      background: transparent;
    }

    #messages::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 4px;
    }

    .msg {
      display: flex;
      gap: 14px;
      padding: 10px 20px;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      background: var(--user-bg);
    }

    .msg.claude {
      background: transparent;
    }

    .avatar {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: grid;
      place-items: center;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .msg.user .avatar {
      background: var(--accent);
      color: #1a1200;
    }

    .msg.claude .avatar {
      background: var(--accent2);
      color: #001220;
    }

    .bubble {
      flex: 1;
      font-size: 14.5px;
      line-height: 1.65;
      color: var(--text);
      word-break: break-word;
      min-width: 0;
    }

    /* ── Usuario: texto plano ── */
    .bubble.plain { white-space: pre-wrap; }

    /* ── Markdown rendered styles ── */
    .bubble.md p { margin: 0 0 .75em; }
    .bubble.md p:last-child { margin-bottom: 0; }

    .bubble.md h1, .bubble.md h2, .bubble.md h3,
    .bubble.md h4, .bubble.md h5, .bubble.md h6 {
      font-family: var(--mono);
      color: var(--accent);
      margin: 1em 0 .4em;
      font-weight: 600;
      line-height: 1.3;
    }
    .bubble.md h1 { font-size: 1.25em; }
    .bubble.md h2 { font-size: 1.1em; }
    .bubble.md h3 { font-size: 1em; color: var(--accent2); }

    .bubble.md strong { color: #f0d4b0; font-weight: 600; }
    .bubble.md em    { color: var(--accent2); font-style: italic; }

    .bubble.md ul, .bubble.md ol {
      padding-left: 1.4em;
      margin: .4em 0 .75em;
    }
    .bubble.md li { margin: .25em 0; }

    .bubble.md code {
      font-family: var(--mono);
      font-size: .85em;
      background: #0a0c0f;
      color: #7dd3b0;
      padding: .15em .4em;
      border-radius: 4px;
      border: 1px solid #1e2730;
    }

    .bubble.md pre {
      background: #0a0c0f;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      overflow-x: auto;
      margin: .6em 0;
    }
    .bubble.md pre code {
      background: none;
      border: none;
      padding: 0;
      color: #a8d8c0;
      font-size: .82em;
      white-space: pre;
    }

    .bubble.md blockquote {
      border-left: 3px solid var(--accent);
      margin: .6em 0;
      padding: .3em 0 .3em 1em;
      color: var(--muted);
      font-style: italic;
    }

    .bubble.md table {
      border-collapse: collapse;
      width: 100%;
      margin: .6em 0;
      font-size: .88em;
    }
    .bubble.md th {
      background: #1a1f28;
      color: var(--accent2);
      font-family: var(--mono);
      font-weight: 600;
      text-align: left;
      padding: 6px 10px;
      border: 1px solid var(--border);
    }
    .bubble.md td {
      padding: 5px 10px;
      border: 1px solid var(--border);
    }
    .bubble.md tr:nth-child(even) td { background: #12161b; }

    .bubble.md a {
      color: var(--accent2);
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .bubble.md hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: .8em 0;
    }

    /* ── Typing indicator ── */
    .typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 6px 0;
    }

    .typing span {
      width: 6px;
      height: 6px;
      background: var(--accent2);
      border-radius: 50%;
      animation: bounce .9s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .15s;
    }

    .typing span:nth-child(3) {
      animation-delay: .30s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(.8);
        opacity: .5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    /* ── Empty state ── */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 10px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 12px;
      text-align: center;
      user-select: none;
    }

    #empty .big {
      font-size: 40px;
    }

    /* ── Input bar ── */
    footer {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      max-width: 860px;
      margin: 0 auto;
    }

    #input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      font-family: var(--sans);
      font-size: 14px;
      color: var(--text);
      resize: none;
      min-height: 42px;
      max-height: 160px;
      line-height: 1.5;
      outline: none;
      transition: border-color .15s;
    }

    #input:focus {
      border-color: var(--accent2);
    }

    #input::placeholder {
      color: var(--muted);
    }

    #send {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      transition: opacity .15s, transform .1s;
      color: #1a1200;
    }

    #send:hover:not(:disabled) {
      opacity: .85;
    }

    #send:active:not(:disabled) {
      transform: scale(.95);
    }

    #send:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    #send svg {
      width: 18px;
      height: 18px;
    }

    /* ── Error banner ── */
    #error-bar {
      display: none;
      background: #2a1515;
      border-top: 1px solid #5a2020;
      padding: 8px 20px;
      font-family: var(--mono);
      font-size: 12px;
      color: #e87c7c;
      flex-shrink: 0;
    }

    /* ── Settings panel ── */
    #settings-btn {
      margin-left: 8px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      transition: border-color .15s, color .15s;
    }
    #settings-btn:hover { border-color: var(--accent2); color: var(--accent2); }
    #settings-btn.active { border-color: var(--accent); color: var(--accent); }

    #settings-panel {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 20px;
      flex-shrink: 0;
      animation: fadeIn .15s ease;
    }
    #settings-panel.open { display: block; }

    .settings-inner {
      max-width: 860px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .settings-label {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .settings-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #api-key-input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      letter-spacing: .04em;
    }
    #api-key-input:focus { border-color: var(--accent2); }
    #api-key-input::placeholder { color: var(--muted); }

    #save-key-btn {
      background: var(--accent);
      color: #1a1200;
      border: none;
      border-radius: var(--radius);
      padding: 8px 14px;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .06em;
      transition: opacity .15s;
      white-space: nowrap;
    }
    #save-key-btn:hover { opacity: .85; }

    #clear-key-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 8px 10px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }
    #clear-key-btn:hover { border-color: #e87c7c; color: #e87c7c; }

    .key-status {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .key-status.ok { color: #4caf6e; }
    .key-status.missing { color: #e8a87c; }

    /* ── Provider / Model selects ── */
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    @media (max-width: 560px) { .settings-grid { grid-template-columns: 1fr; } }

    .settings-field {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    select.settings-select, input.settings-input-sm {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 7px 10px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--text);
      outline: none;
      transition: border-color .15s;
      width: 100%;
    }
    select.settings-select { cursor: pointer; }
    select.settings-select:focus,
    input.settings-input-sm:focus { border-color: var(--accent2); }

    .provider-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--mono);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
      background: #1a2230;
      border: 1px solid var(--border);
      color: var(--accent2);
      margin-left: 6px;
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">✦</div>
    <h1 id="header-title">AI Chat · PoC</h1>
    <span id="provider-badge" class="provider-badge">anthropic</span>

    <span class="stat-sep">·</span>

    <div class="header-stats">
      <span class="stat-label">Tokens sesión&nbsp;</span>
      <span class="stat-value" id="stat-tokens">0</span>
      <span class="stat-sep">·</span>
      <span class="stat-label">↑&nbsp;</span>
      <span class="stat-value" id="stat-in">0</span>
      <span class="stat-sep">&nbsp;↓&nbsp;</span>
      <span class="stat-value" id="stat-out">0</span>
    </div>

    <div class="status">
      <div class="dot" id="dot"></div>
      <span id="status-text">listo</span>
    </div>
    <button id="settings-btn" title="Configurar API Key">⚙</button>
  </header>

  <!-- Settings panel (below header) -->
  <div id="settings-panel">
    <div class="settings-inner">

      <!-- Fila 1: Proveedor + Modelo -->
      <div class="settings-grid">
        <div class="settings-field">
          <span class="settings-label">Proveedor</span>
          <select id="provider-select" class="settings-select">
            <option value="anthropic">Anthropic (via Worker)</option>
            <option value="github">GitHub Models</option>
            <option value="openai">OpenAI compatible (custom)</option>
          </select>
        </div>
        <div class="settings-field">
          <span class="settings-label">Modelo</span>
          <input id="model-input" class="settings-input-sm" type="text" placeholder="nombre del modelo" autocomplete="off" spellcheck="false" />
        </div>
      </div>

      <!-- Fila 2: API Key -->
      <span class="settings-label">API Key / Token</span>
      <div class="settings-row">
        <input id="api-key-input" type="text" placeholder="sk-ant-api03-… / ghp_… / sk-…" autocomplete="off" spellcheck="false" style="-webkit-text-security:disc" />
        <button id="toggle-key-btn" title="Mostrar/ocultar" style="background:none;border:1px solid var(--border);border-radius:6px;color:var(--muted);cursor:pointer;width:32px;height:34px;display:grid;place-items:center;font-size:13px;flex-shrink:0">👁</button>
        <button id="save-key-btn">Guardar</button>
        <button id="clear-key-btn" title="Borrar key">✕</button>
      </div>
      <span class="key-status" id="key-status">Sin key configurada</span>

      <!-- Fila 3: Worker URL (solo Anthropic) -->
      <div id="worker-url-row" class="settings-field">
        <span class="settings-label" id="worker-url-label">Worker URL</span>
        <input id="worker-url-input" class="settings-input-sm" type="text" placeholder="https://…workers.dev/v1/messages" autocomplete="off" spellcheck="false" />
      </div>

    </div>
  </div>

  <div id="messages">
    <div id="empty">
      <div class="big">✦</div>
      <div>Enviá tu primer mensaje</div>
    </div>
  </div>

  <div id="error-bar" role="alert"></div>

  <footer>
    <div class="input-row">
      <textarea id="input" rows="1" placeholder="Escribí tu mensaje… (Enter para enviar, Shift+Enter para nueva línea)"
        autocomplete="off"></textarea>
      <button id="send" title="Enviar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
          stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13" />
          <polygon points="22 2 15 22 11 13 2 9 22 2" />
        </svg>
      </button>
    </div>
  </footer>

  <script>
    // ══════════════════════════════════════════
    //  DEFAULTS  ← se pueden cambiar acá o desde el panel ⚙
    // ══════════════════════════════════════════
    const DEFAULT_WORKER_URL    = "https://muddy-wildflower-c8f9.claudioabril1000.workers.dev/v1/messages";
    const DEFAULT_WORKER_GH_URL = "https://black-term-27aa.claudioabril1000.workers.dev";
    const DEFAULT_PROVIDER      = "anthropic";   // "anthropic" | "github" | "openai"
    const DEFAULT_MODEL         = "claude-sonnet-4-6";
    const SYSTEM = "Eres un asistente útil y conciso. Respondés en el mismo idioma del usuario.";

    // Modelos por defecto por proveedor
    const DEFAULT_MODELS = {
      anthropic: "claude-sonnet-4-6",
      github:    "gpt-4o-mini",
      openai:    "gpt-4o-mini",
    };

    // Endpoints fijos por proveedor (github y anthropic usan Workers configurables)
    const PROVIDER_ENDPOINTS = {
      openai: "https://api.openai.com/v1/chat/completions",
    };
    // ══════════════════════════════════════════

    const messagesEl   = document.getElementById("messages");
    const emptyEl      = document.getElementById("empty");
    const inputEl      = document.getElementById("input");
    const sendBtn      = document.getElementById("send");
    const dotEl        = document.getElementById("dot");
    const statusEl     = document.getElementById("status-text");
    const errorBar     = document.getElementById("error-bar");
    const headerBadge  = document.getElementById("provider-badge");

    // ── Settings refs ──
    const settingsBtn     = document.getElementById("settings-btn");
    const settingsPanel   = document.getElementById("settings-panel");
    const apiKeyInput     = document.getElementById("api-key-input");
    const saveKeyBtn      = document.getElementById("save-key-btn");
    const clearKeyBtn     = document.getElementById("clear-key-btn");
    const toggleKeyBtn    = document.getElementById("toggle-key-btn");
    const keyStatus       = document.getElementById("key-status");
    const providerSelect  = document.getElementById("provider-select");
    const modelInput      = document.getElementById("model-input");
    const workerUrlInput  = document.getElementById("worker-url-input");
    const workerUrlRow    = document.getElementById("worker-url-row");

    // ── LocalStorage keys ──
    const LS_KEY      = "poc_api_key";
    const LS_PROVIDER = "poc_provider";
    const LS_MODEL    = "poc_model";
    const LS_WORKER    = "poc_worker_url";
    const LS_WORKER_GH = "poc_worker_gh_url";

    // ── Persistence helpers ──
    const load  = k       => localStorage.getItem(k) || "";
    const save  = (k, v)  => v ? localStorage.setItem(k, v) : localStorage.removeItem(k);

    function getProvider()  { return load(LS_PROVIDER) || DEFAULT_PROVIDER; }
    function getModel()     { return load(LS_MODEL)    || DEFAULT_MODELS[getProvider()] || DEFAULT_MODEL; }
    function getWorkerUrl()   { return load(LS_WORKER)    || DEFAULT_WORKER_URL; }
    function getGhWorkerUrl() { return load(LS_WORKER_GH) || DEFAULT_WORKER_GH_URL; }
    function getApiKey()      { return load(LS_KEY); }

    // ── Actualizar badge del header ──
    function updateBadge() {
      const p = getProvider();
      const m = getModel();
      headerBadge.textContent = `${p} · ${m}`;
    }

    // ── Mostrar/ocultar Worker URL según proveedor ──
    function onProviderChange() {
      const p = providerSelect.value;
      workerUrlRow.style.display = (p === "anthropic" || p === "github") ? "" : "none";
      workerUrlInput.placeholder = p === "github" ? "https://…workers.dev" : "https://…workers.dev/v1/messages";
      if (p === "github" && (workerUrlInput.value === getWorkerUrl() || !workerUrlInput.value)) {
        workerUrlInput.value = getGhWorkerUrl();
      } else if (p === "anthropic" && !workerUrlInput.value) {
        workerUrlInput.value = getWorkerUrl();
      }
      // sugerir modelo por defecto si el campo está vacío o era de otro proveedor
      if (!modelInput.value || Object.values(DEFAULT_MODELS).includes(modelInput.value)) {
        modelInput.value = DEFAULT_MODELS[p] || "";
      }
    }
    providerSelect.addEventListener("change", onProviderChange);

    // ── Cargar estado guardado en el panel ──
    function loadSettingsPanel() {
      providerSelect.value   = getProvider();
      modelInput.value       = getModel();
      const p0 = getProvider();
      workerUrlInput.value = p0 === "github" ? getGhWorkerUrl() : getWorkerUrl();
      apiKeyInput.value      = getApiKey();
      onProviderChange();
      refreshKeyStatus();
    }

    function refreshKeyStatus() {
      const k = getApiKey();
      if (k) {
        keyStatus.textContent = "✓ Key configurada (" + k.slice(0, 14) + "…)";
        keyStatus.className   = "key-status ok";
        settingsBtn.classList.add("active");
      } else {
        keyStatus.textContent = "Sin key configurada";
        keyStatus.className   = "key-status missing";
        settingsBtn.classList.remove("active");
      }
    }

    // Init
    loadSettingsPanel();
    updateBadge();

    settingsBtn.addEventListener("click", () => {
      settingsPanel.classList.toggle("open");
    });

    saveKeyBtn.addEventListener("click", () => {
      save(LS_KEY,      apiKeyInput.value.trim());
      save(LS_PROVIDER, providerSelect.value);
      save(LS_MODEL,    modelInput.value.trim());
      const sp = providerSelect.value;
      if (sp === "github") {
        save(LS_WORKER_GH, workerUrlInput.value.trim());
      } else {
        save(LS_WORKER,    workerUrlInput.value.trim());
      }
      refreshKeyStatus();
      updateBadge();
      settingsPanel.classList.remove("open");
    });

    toggleKeyBtn.addEventListener("click", () => {
      const masked = apiKeyInput.style.webkitTextSecurity !== "none";
      apiKeyInput.style.webkitTextSecurity = masked ? "none" : "disc";
      toggleKeyBtn.textContent = masked ? "🙈" : "👁";
    });

    clearKeyBtn.addEventListener("click", () => {
      apiKeyInput.value = "";
      save(LS_KEY, "");
      refreshKeyStatus();
    });

    // ══════════════════════════════════════════
    //  Construcción de request según proveedor
    // ══════════════════════════════════════════
    function buildRequest(chatHistory) {
      const provider = getProvider();
      const model    = getModel();
      const apiKey   = getApiKey();

      if (provider === "anthropic") {
        // ── Formato Anthropic Messages API ──
        return {
          url: getWorkerUrl(),
          headers: {
            "Content-Type":       "application/json",
            "anthropic-version":  "2023-06-01",
            ...(apiKey ? { "x-user-api-key": apiKey } : {}),
          },
          body: JSON.stringify({
            model,
            max_tokens: 1024,
            system: SYSTEM,
            messages: chatHistory,
          }),
        };
      } else {
        // ── Formato OpenAI Chat Completions (GitHub Models, OpenAI, etc.) ──
        // Convertir historial al formato OpenAI (role: user/assistant)
        const oaiMessages = [
          { role: "system", content: SYSTEM },
          ...chatHistory.map(m => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })),
        ];
        return {
          url: provider === "github" ? getGhWorkerUrl() : (PROVIDER_ENDPOINTS[provider] || PROVIDER_ENDPOINTS.openai),
          headers: {
            "Content-Type":  "application/json",
            "Authorization": `Bearer ${apiKey}`,
          },
          body: JSON.stringify({
            model,
            max_tokens: 1024,
            messages: oaiMessages,
          }),
        };
      }
    }

    // ── Extraer texto y usage de la respuesta según proveedor ──
    function parseResponse(data) {
      const provider = getProvider();
      if (provider === "anthropic") {
        return {
          text:  data.content?.[0]?.text ?? "(sin respuesta)",
          usage: data.usage ?? null,
        };
      } else {
        // OpenAI-compatible
        const text  = data.choices?.[0]?.message?.content ?? "(sin respuesta)";
        const usage = data.usage
          ? { input_tokens: data.usage.prompt_tokens, output_tokens: data.usage.completion_tokens }
          : null;
        return { text, usage };
      }
    }

    // ══════════════════════════════════════════
    const chatHistory = [];
    let busy = false;
    let totalIn = 0, totalOut = 0;

    const statTokens = document.getElementById("stat-tokens");
    const statIn     = document.getElementById("stat-in");
    const statOut    = document.getElementById("stat-out");

    function fmt(n) { return n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n); }

    function updateTokens(usage) {
      if (!usage) return;
      totalIn  += usage.input_tokens  ?? 0;
      totalOut += usage.output_tokens ?? 0;
      statIn.textContent     = fmt(totalIn);
      statOut.textContent    = fmt(totalOut);
      statTokens.textContent = fmt(totalIn + totalOut);
      [statTokens, statIn, statOut].forEach(el => {
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 600);
      });
    }

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });

    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    sendBtn.addEventListener("click", send);

    function addBubble(role, text) {
      emptyEl.style.display = "none";
      const msg = document.createElement("div");
      msg.className = `msg ${role === "assistant" ? "claude" : role}`;
      const av  = document.createElement("div");
      av.className  = "avatar";
      av.textContent = role === "user" ? "TÚ" : "AI";
      const bub = document.createElement("div");
      if (role === "assistant") {
        bub.className = "bubble md";
        bub.innerHTML = marked.parse(text);
      } else {
        bub.className = "bubble plain";
        bub.textContent = text;
      }
      msg.appendChild(av);
      msg.appendChild(bub);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bub;
    }

    function addTyping() {
      const msg = document.createElement("div");
      msg.className = "msg claude"; msg.id = "typing-msg";
      const av = document.createElement("div"); av.className = "avatar"; av.textContent = "AI";
      const t  = document.createElement("div"); t.className  = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";
      msg.appendChild(av); msg.appendChild(t);
      messagesEl.appendChild(msg);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function removeTyping() { document.getElementById("typing-msg")?.remove(); }

    function setLoading(on) {
      busy = on;
      sendBtn.disabled = on; inputEl.disabled = on;
      dotEl.className = on ? "dot error" : "dot";
      statusEl.textContent = on ? "procesando…" : "listo";
      if (on) errorBar.style.display = "none";
    }
    function showError(msg) {
      errorBar.textContent = "⚠ " + msg; errorBar.style.display = "block";
      dotEl.className = "dot error"; statusEl.textContent = "error";
    }

    function log(level, ...args) {
      const ts = new Date().toISOString().slice(11, 23);
      const prefix = `[PoC ${ts}]`;
      if (level === "error") console.error(prefix, ...args);
      else if (level === "warn")  console.warn(prefix, ...args);
      else                        console.log(prefix, ...args);
    }

    async function send() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      inputEl.value = ""; inputEl.style.height = "auto";
      addBubble("user", text);
      chatHistory.push({ role: "user", content: text });
      setLoading(true); addTyping();

      const req = buildRequest(chatHistory);
      log("info", "Provider:", getProvider(), "| Model:", getModel());
      log("info", "→", req.url);

      try {
        const res = await fetch(req.url, { method: "POST", headers: req.headers, body: req.body });
        log("info", "Status:", res.status, res.statusText);

        if (!res.ok) {
          let errBody = {};
          try { errBody = await res.json(); } catch (_) {}
          log("error", "Error body:", errBody);
          throw new Error(errBody?.error?.message || `HTTP ${res.status}`);
        }

        const data = await res.json();
        log("info", "Response:", data);

        const { text: reply, usage } = parseResponse(data);
        if (usage) updateTokens(usage);

        removeTyping();
        addBubble("assistant", reply);
        chatHistory.push({ role: "assistant", content: reply });

      } catch (err) {
        log("error", err.name, "–", err.message);
        removeTyping();
        showError(err.message);
      } finally {
        setLoading(false); inputEl.focus();
      }
    }

    // ── Configurar marked ──
    marked.setOptions({
      breaks: true,       // saltos de línea simples → <br>
      gfm: true,          // GitHub Flavored Markdown
    });

    // ── Versión dinámica (fecha de generación del archivo) ──
    (function () {
      const pad = n => String(n).padStart(2, "0");
      const d = new Date();
      const ver = `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.1`;
      document.title = `AI Chat – PoC – ${ver}`;
      const h1 = document.getElementById("header-title");
      if (h1) h1.textContent = `AI Chat · PoC · ${ver}`;
    })();

    inputEl.focus();
  </script>
</body>

</html>
